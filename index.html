<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <button id="theme-toggle" aria-label="Alternar tema" title="Alternar tema" style="position:fixed;top:12px;right:12px;z-index:2;padding:8px 10px;border-radius:6px;border:none;cursor:pointer;background:rgba(255,255,255,0.06);color:inherit">🌙</button>
    <main>
        <section aria-label="Perfis de usuários">
            <h1 class="section-title">Quem está assistindo?</h1>
            <ul class="perfis">
                <li>
                    <ul class="perfis-ordenadas">
                        <li>
                            <a href="#" class="perfil">
                                <figure>
                                    <img src="imagens/perfil1.jpg" alt="Avatar do Perfil 1">
                                    <figcaption>Bernardo</figcaption>
                                </figure>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="perfil">
                                <figure>
                                    <img src="imagens/perfil2.jpg" alt="Avatar do Perfil 2">
                                    <figcaption>Bruna</figcaption>
                                </figure>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </section>
</main>
    <script src="script.js"></script>
</body>
</html>
